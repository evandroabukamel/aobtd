services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aobtd
      POSTGRES_PASSWORD: aobtd
      POSTGRES_DB: aobtd
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aobtd']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      # Site links baked into the frontend (values come from the .env next to this file).
      args:
        VITE_REPO_URL: ${VITE_REPO_URL:-}
        VITE_GITHUB_SPONSORS_URL: ${VITE_GITHUB_SPONSORS_URL:-}
        VITE_KOFI_URL: ${VITE_KOFI_URL:-}
        VITE_BUYMEACOFFEE_URL: ${VITE_BUYMEACOFFEE_URL:-}
    environment:
      DATABASE_URL: postgres://aobtd:aobtd@db:5432/aobtd
      WEB_DIST: apps/web/dist
    ports: ['3000:3000']
    depends_on: { db: { condition: service_healthy } }

  collector:
    build: .
    command: ['node', 'apps/collector/dist/index.js', '--http']
    environment:
      DATABASE_URL: postgres://aobtd:aobtd@db:5432/aobtd
      COLLECTOR_SCHEDULER: 'on'
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-aobtd-crash-monitor/1.0}
    ports: ['3333:3333']
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
